# ----------------------------------------------------------------------
# Alembic configuration for SQLAlchemy migrations
# ----------------------------------------------------------------------
[alembic]
# Path to the migration folder (relative to this file)
script_location = migrations

# Name of the version table used by alembic
version_table_name = alembic_version

# URL of the database – overridden by the ``DATABASE_URL`` env var at runtime
sqlalchemy.url = ${DATABASE_URL}

# ----------------------------------------------------------------------
# Optional sqlalchemy section – kept for clarity
# ----------------------------------------------------------------------
[sqlalchemy]
# This URL is only used when ``alembic`` is invoked without the env var.
# In production the env var takes precedence.
url = ${DATABASE_URL}

# ----------------------------------------------------------------------
# Plugin configuration (leave empty unless you have custom plugins)
# ----------------------------------------------------------------------
[plugin]